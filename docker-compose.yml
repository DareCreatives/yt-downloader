version: "3.9"

services:
  yt-downloader:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./downloads:/app/downloads
      # Uncomment if you have a cookies.txt for age-restricted content:
      # - ./cookies.txt:/app/cookies.txt:ro
    restart: unless-stopped
